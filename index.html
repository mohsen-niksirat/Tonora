<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1220">
<meta name="description" content="Tonora — play instruments, learn songs, compose music. All in your browser.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Tonora 🎹</title>
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
<header>
  <span class="logo">Tonora</span>
  <nav class="mode-tabs" id="mode-tabs"></nav>
  <div class="vol-wrap" title="Volume">
    <span class="vol-icon" id="vol-icon">🔊</span>
    <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.7">
  </div>
  <canvas id="vis-canvas" width="64" height="24" title="Audio Visualizer"></canvas>
  <button class="icon-btn" id="kb-btn" title="Shortcuts">⌨️</button>
  <button class="icon-btn" id="theme-btn" title="Theme">🌓</button>
  <button class="icon-btn" id="lang-btn" title="Language">🌐</button>
</header>
<main id="app"></main>

<!-- Keyboard Shortcuts Modal -->
<div id="kb-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="kb-title">⌨️ Keyboard Shortcuts</h3>
      <button class="btn icon-btn" id="kb-close">✕</button>
    </div>
    <div class="kb-table-wrap">
      <table class="kb-table">
        <tr><th>Key</th><th>Action</th></tr>
        <tr><td><kbd>A</kbd>, <kbd>S</kbd>, <kbd>D</kbd>, <kbd>F</kbd>, <kbd>G</kbd>, <kbd>H</kbd>, <kbd>J</kbd></td><td>First Octave (White keys)</td></tr>
        <tr><td><kbd>W</kbd>, <kbd>E</kbd>, <kbd>T</kbd>, <kbd>Y</kbd>, <kbd>U</kbd></td><td>First Octave (Black keys)</td></tr>
        <tr><td><kbd>K</kbd>, <kbd>L</kbd>, <kbd>;</kbd>, <kbd>'</kbd>...</td><td>Second Octave (White keys)</td></tr>
        <tr><td><kbd>O</kbd>, <kbd>P</kbd>...</td><td>Second Octave (Black keys)</td></tr>
        <tr><td><kbd>Space</kbd></td><td>Toggle Sustain Pedal</td></tr>
        <tr><td><kbd>1</kbd>–<kbd>8</kbd> (Drums)</td><td>Trigger Drum Pads</td></tr>
      </table>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=7"></script>
<script src="js/achievements.js?v=7"></script>
<script src="js/audio.js?v=7"></script>
<script src="js/piano.js?v=7"></script>
<script src="js/play.js?v=7"></script>
<script src="js/learn.js?v=7"></script>
<script src="js/compose.js?v=7"></script>
<script>
'use strict';
window.__jsErrors = [];
window.addEventListener('error', e => window.__jsErrors.push(e.message));
window.addEventListener('unhandledrejection', e => window.__jsErrors.push(String(e.reason)));

let INSTRUMENTS = [], SONGS = [];

async function loadData() {
  const [i, s] = await Promise.all([
    fetch('data/instruments.json?v=7').then(r => r.json()),
    fetch('data/songs.json?v=7').then(r => r.json())
  ]);
  INSTRUMENTS = i.instruments;
  SONGS = s.songs;
  window.TONORA_INSTRUMENTS = INSTRUMENTS;
  window.TONORA_SONGS = SONGS;
}

const MODES = [
  { id: 'home', icon: '🏠' },
  { id: 'play', icon: '🎹' },
  { id: 'learn', icon: '🎓' },
  { id: 'compose', icon: '🎛️' }
];

let currentMode = 'home';

function renderTabs() {
  const tabs = document.getElementById('mode-tabs');
  tabs.innerHTML = '';
  MODES.forEach(m => {
    const b = document.createElement('button');
    b.className = 'mode-tab' + (m.id === currentMode ? ' active' : '');
    b.dataset.mode = m.id;
    b.innerHTML = `<span>${m.icon}</span> ${t(m.id)}`;
    b.onclick = () => switchMode(m.id);
    tabs.appendChild(b);
  });
}

function switchMode(id) {
  const app = document.getElementById('app');
  // teardown
  if (currentMode === 'play') PlayMode.leave();
  if (currentMode === 'learn') LearnMode.leave();
  if (currentMode === 'compose') ComposeMode.leave();
  currentMode = id;
  renderTabs();
  TonoraAchievements.touchStreak();
  if (typeof window.armAudioRevive === 'function') window.armAudioRevive();
  if (id === 'home') renderHome(app);
  if (id === 'play') PlayMode.enter(app);
  if (id === 'learn') LearnMode.enter(app);
  if (id === 'compose') ComposeMode.enter(app);
}

function renderHome(app) {
  app.innerHTML = `
    <div class="home-hero">
      <h1>🎹 Tonora</h1>
      <p>Play · Learn · Compose — all in your browser</p>
    </div>
    <div class="mode-cards">
      <button class="mode-card" data-go="play"><span class="big">🎹</span><strong>${t('play')}</strong></button>
      <button class="mode-card" data-go="learn"><span class="big">🎓</span><strong>${t('learn')}</strong></button>
      <button class="mode-card" data-go="compose"><span class="big">🎛️</span><strong>${t('compose')}</strong></button>
    </div>
    <div id="ach-grid"></div>`;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => switchMode(b.dataset.go));
  TonoraAchievements.renderGrid(app.querySelector('#ach-grid'));
}

function applyLangUI() {
  setLang(getLang());
  renderTabs();
  switchMode(currentMode);
  document.getElementById('lang-btn').textContent = getLang() === 'fa' ? '🌐 EN' : '🌐 FA';
}

document.getElementById('lang-btn').onclick = () => {
  applyLangUI._l = getLang() === 'fa' ? 'en' : 'fa';
  localStorage.setItem('tonora-lang', applyLangUI._l);
  location.reload();
};
document.getElementById('theme-btn').onclick = () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('tonora-theme', h.dataset.theme);
  document.querySelector('meta[name=theme-color]').content = h.dataset.theme === 'dark' ? '#0f1220' : '#f2f4fb';
};
const savedTheme = localStorage.getItem('tonora-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

// Volume control
const volSlider = document.getElementById('vol-slider');
const volIcon = document.getElementById('vol-icon');
if (volSlider) {
  volSlider.oninput = e => {
    const v = +e.target.value;
    window.TonoraAudio.setMasterGain(v);
    if (volIcon) volIcon.textContent = v === 0 ? '🔇' : (v < 0.5 ? '🔉' : '🔊');
    localStorage.setItem('tonora-volume', v);
  };
  const savedVol = localStorage.getItem('tonora-volume');
  if (savedVol !== null) {
    volSlider.value = savedVol;
    if (volIcon) volIcon.textContent = +savedVol === 0 ? '🔇' : (+savedVol < 0.5 ? '🔉' : '🔊');
  }
}

// Visualizer canvas animation loop
const visCanvas = document.getElementById('vis-canvas');
if (visCanvas) {
  const vCtx = visCanvas.getContext('2d');
  function drawVis() {
    requestAnimationFrame(drawVis);
    const data = window.TonoraAudio.getVisualizerData();
    vCtx.clearRect(0, 0, visCanvas.width, visCanvas.height);
    if (!data) return;
    const barWidth = (visCanvas.width / data.length) * 1.5;
    let x = 0;
    for (let i = 0; i < data.length; i++) {
      const barHeight = (data[i] / 255) * visCanvas.height;
      vCtx.fillStyle = `rgba(108, 140, 255, ${0.3 + (data[i] / 255) * 0.7})`;
      vCtx.fillRect(x, visCanvas.height - barHeight, barWidth - 1, barHeight);
      x += barWidth;
      if (x > visCanvas.width) break;
    }
  }
  drawVis();
}

// Shortcuts modal
const kbBtn = document.getElementById('kb-btn');
const kbModal = document.getElementById('kb-modal');
const kbClose = document.getElementById('kb-close');
if (kbBtn && kbModal && kbClose) {
  kbBtn.onclick = () => {
    document.getElementById('kb-title').textContent = `⌨️ ${t('shortcuts')}`;
    kbModal.classList.remove('hidden');
  };
  kbClose.onclick = () => kbModal.classList.add('hidden');
  kbModal.onclick = (e) => { if (e.target === kbModal) kbModal.classList.add('hidden'); };
}

// PWA
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

loadData().then(() => {
  const savedVol = localStorage.getItem('tonora-volume');
  if (savedVol !== null) window.TonoraAudio.setMasterGain(+savedVol);
  document.documentElement.lang = getLang();
  document.documentElement.dir = getLang() === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('lang-btn').textContent = getLang() === 'fa' ? '🌐 EN' : '🌐 FA';
  renderTabs();
  switchMode('home');
});
</script>
</body>
</html>
